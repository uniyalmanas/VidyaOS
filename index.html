    <style>
      /* Branded boot splash — pure inline SVG/CSS so no asset or network is
         needed. Fades itself out (and stops intercepting input) on its own. */
      #vidya-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        pointer-events: none;
        background: linear-gradient(180deg, #F5F5F7 0%, #FFFFFF 100%);
        animation: vidya-splash-out 1.5s ease forwards;
      }
      @media (prefers-color-scheme: dark) {
        #vidya-splash { background: linear-gradient(180deg, #000000 0%, #0D0D0F 100%); }
      }
      #vidya-splash .vs-mark {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 10px 28px rgba(255, 61, 0, 0.38));
        animation: vidya-splash-pop 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #vidya-splash .vs-word {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      #vidya-splash .vs-word .vs-v {
        background: linear-gradient(120deg, #4F46E5, #7C3AED 45%, #EA580C);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #vidya-splash .vs-word .vs-os { color: #1D1D1F; }
      @media (prefers-color-scheme: dark) {
        #vidya-splash .vs-word .vs-os { color: #F5F5F7; }
      }
      #vidya-splash .vs-bar {
        width: 128px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #6366F1, #7C3AED, #EA580C, #7C3AED, #6366F1);
        background-size: 200% auto;
        animation: vidya-splash-bar 1.2s linear infinite;
      }
      @keyframes vidya-splash-bar {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      @keyframes vidya-splash-pop {
        0% { opacity: 0; transform: scale(0.82) translateY(6px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes vidya-splash-out {
        0%, 62% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #vidya-splash { animation-duration: 0.01s; }
        #vidya-splash .vs-mark { animation: none; }
        #vidya-splash .vs-bar { animation: none; }
      }
    </style>
  </head>
