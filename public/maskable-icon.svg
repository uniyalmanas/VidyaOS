<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Full-bleed tile: brand indigo → violet -->
    <linearGradient id="vTileM" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="52%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Warm saffron floor glow behind the flame -->
    <radialGradient id="vGlowM" cx="50%" cy="84%" r="66%">
      <stop offset="0%" stop-color="#FF8A3D" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#FF8A3D" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="0" />
    </radialGradient>

    <!-- Top sheen for depth -->
    <linearGradient id="vSheenM" x1="256" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Radiant Prism facets -->
    <linearGradient id="vFlameLM" x1="12" y1="4" x2="24" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#E53935" />
    </linearGradient>
    <linearGradient id="vFlameRM" x1="36" y1="4" x2="24" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="45%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FB8C00" />
    </linearGradient>
    <linearGradient id="vBaseM" x1="8" y1="36" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="50%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <linearGradient id="vSpineM" x1="24" y1="6" x2="24" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background (mask safe zone handled by keeping the mark centred) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#vTileM)" />
  <rect x="0" y="0" width="512" height="512" fill="url(#vGlowM)" />
  <rect x="0" y="0" width="512" height="512" fill="url(#vSheenM)" />

  <!-- Orbit ring (the "OS" layer), kept inside the 80% safe circle -->
  <circle cx="256" cy="256" r="180" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="4 15" />

  <!-- Emblem halo so the mark lifts off the tile -->
  <g fill="#FFFFFF" fill-opacity="0.16" transform="translate(40 40) scale(9)">
    <path d="M8 36.5C13.5 35 19 36 24 38.5C29 36 34.5 35 40 36.5C38 41 31.5 43.5 24 43.5C16.5 43.5 10 41 8 36.5Z" />
    <path d="M24 6.5C24 6.5 13 17 11 26C9.5 32.5 15.5 36.5 24 38.5C20.5 33 21 24 24 16.5V6.5Z" />
    <path d="M24 6.5V16.5C27 24 27.5 33 24 38.5C32.5 36.5 38.5 32.5 37 26C35 17 24 6.5 24 6.5Z" />
  </g>

  <!-- The Vidya Radiant Prism -->
  <g transform="translate(40 40) scale(9)">
    <path d="M8 36.5C13.5 35 19 36 24 38.5C29 36 34.5 35 40 36.5C38 41 31.5 43.5 24 43.5C16.5 43.5 10 41 8 36.5Z" fill="url(#vBaseM)" />
    <path d="M8.5 36.5C13.8 35.1 19.1 36.1 24 38.5C28.9 36.1 34.2 35.1 39.5 36.5" stroke="#FFE082" stroke-width="1.25" stroke-linecap="round" stroke-opacity="0.95" />
    <path d="M24 6.5C24 6.5 13 17 11 26C9.5 32.5 15.5 36.5 24 38.5C20.5 33 21 24 24 16.5V6.5Z" fill="url(#vFlameLM)" />
    <path d="M24 6.5V16.5C27 24 27.5 33 24 38.5C32.5 36.5 38.5 32.5 37 26C35 17 24 6.5 24 6.5Z" fill="url(#vFlameRM)" />
    <path d="M24 18L27.5 24.5L24 31L20.5 24.5L24 18Z" fill="#FF6D00" stroke="#FFE082" stroke-width="0.8" />
    <path d="M24 8.5L24.8 20L24 34" stroke="url(#vSpineM)" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>